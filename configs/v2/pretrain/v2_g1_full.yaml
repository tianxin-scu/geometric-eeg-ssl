# v2 E5 ablation: G1 (score-bias only) + full descriptor.
#
# Where g_ij enters attention (proposal E5 / O1): G1 = additive per-head
# score bias only (geometry decides *who* attends, values unchanged).
# Descriptor = full [p_i, p_j, p_i-p_j, ||p_i-p_j||] (R^10).
# Identical to v2_default.yaml except ablation.geometry_injection = G1.
# Signal cache fingerprint excludes the ablation section, so this reuses the
# same cached signals as the G3 headline run.

preprocess:
  bandpass_hz: [0.5, 45.0]
  resample_hz: 200
  epoch_length_s: 4.0
  detrend: linear
  reference: native
  ica: false
  montage: standard_1005
  normalize: per_epoch_zscore
  coord_normalize: true

ablation:
  geometry_injection: G1           # <-- score-bias only (vs G3 in default)
  geom_descriptor: full
  use_codex: false
  lambda_recon: 1.0
  mask_ratio: 0.5
  mask_scheme: temporal

arch:
  d_model: 256
  patch_samples: 50
  patch_stride: 50
  n_heads_spatial: 8
  n_layers_spatial: 2
  n_heads_temporal: 8
  n_layers_temporal: 4
  mlp_ratio: 4.0
  dropout: 0.0
  temporal_posemb: learned
  geom_mlp_hidden: 32

artifact:
  pretrain:
    clip_sigma: 20.0
  eval:
    autoreject: false
    amplitude_reject_uv: 0.0

train:
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 0.01
  n_epochs: 100
  lr_warmup_epochs: 10
  tau_base: 0.996
  tau_final: 1.0
  lambda_R: 1.0

version: v2
