# v2 pretraining defaults.
#
# Architecture / preprocessing / artifact knobs match v1 so cached signal
# data is reusable (v1 cache fingerprint excludes ablation/train sections).
# v2-specific knobs (mixed-corpus budget, leave-one-out pair) come from
# CLI in scripts/v2_pretrain.py, not from this file.

preprocess:
  bandpass_hz: [0.5, 45.0]
  resample_hz: 200
  epoch_length_s: 4.0
  detrend: linear
  reference: native
  ica: false
  montage: standard_1005
  normalize: per_epoch_zscore
  coord_normalize: true            # ignored by v2; v2 always uses fixed-scale

ablation:
  geometry_injection: G3           # v2 headline uses both score-bias and value-mod
  use_codex: false
  lambda_recon: 1.0
  mask_ratio: 0.5
  mask_scheme: temporal            # v2 drops spatial masking; temporal only
  # mask_scheme used to be "joint" in v1; v2 explicitly switches to "temporal"
  # because the per-channel L_align target already creates per-electrode
  # gradient pressure -- spatial masking on top of it just throws away signal.

arch:
  d_model: 256
  patch_samples: 50
  patch_stride: 50
  n_heads_spatial: 8
  n_layers_spatial: 2
  n_heads_temporal: 8
  n_layers_temporal: 4
  mlp_ratio: 4.0
  dropout: 0.0
  temporal_posemb: learned
  geom_mlp_hidden: 32

artifact:
  pretrain:
    clip_sigma: 20.0
  eval:
    autoreject: false
    amplitude_reject_uv: 0.0

train:
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 0.01
  n_epochs: 100
  lr_warmup_epochs: 10
  tau_base: 0.996
  tau_final: 1.0
  lambda_R: 1.0

version: v2
