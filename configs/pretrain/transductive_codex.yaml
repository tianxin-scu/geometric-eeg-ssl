version: v1

preprocess:
  bandpass_hz: [0.5, 45.0]
  resample_hz: 200
  epoch_length_s: 4.0
  detrend: linear
  normalize: per_epoch_zscore
  reference: native
  ica: false
  montage: standard_1005
  coord_normalize: true

arch:
  d_model: 256
  n_heads_spatial: 8
  n_layers_spatial: 2
  n_heads_temporal: 8
  n_layers_temporal: 4
  mlp_ratio: 4.0
  geom_mlp_hidden: 32
  patch_samples: 50
  patch_stride: 50
  temporal_posemb: learned
  dropout: 0.0

ablation:
  geometry_injection: G1  # ignored when use_codex: true
  use_codex: true
  lambda_recon: 1.0
  mask_ratio: 0.5
  mask_scheme: joint

artifact:
  pretrain:
    clip_sigma: 20.0
  eval:
    amplitude_reject_uv: 0.0
    autoreject: false

train:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  batch_size: 64
  n_epochs: 100
  lr_warmup_epochs: 10
  tau_base: 0.996
  tau_final: 1.0
  lambda_R: 1.0
